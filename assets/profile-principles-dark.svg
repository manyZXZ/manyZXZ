<svg xmlns="http://www.w3.org/2000/svg" width="960" height="278" viewBox="0 0 960 278" role="img" aria-labelledby="title desc"><title id="title">Inspect, compose, verify, document</title><desc id="desc">Public projects show recurring attention to inspectable evidence, separated responsibilities, practical validation, and clear documentation.</desc><rect x="1" y="1" width="958" height="276" rx="24" fill="#071320" stroke="#294359"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="38" font-size="14" fill="#A5BDD1" font-weight="700" letter-spacing="2">RECURRING THEMES IN MY PUBLIC WORK</text><text x="32" y="82" font-size="32" fill="#EFF7FF" font-weight="700" letter-spacing="-0.5">Make the work understandable.</text><rect x="32" y="114" width="200" height="133" rx="16" fill="#0E2133" stroke="#294359"/><circle cx="58" cy="145" r="6" fill="#38C9EF"/><text x="50" y="189" font-size="26" fill="#EFF7FF" font-weight="700">Inspect</text><text x="50" y="225" font-size="16" fill="#A5BDD1" >Show the evidence.</text><rect x="264" y="114" width="200" height="133" rx="16" fill="#0E2133" stroke="#294359"/><circle cx="290" cy="145" r="6" fill="#A6BFFF"/><text x="282" y="189" font-size="26" fill="#EFF7FF" font-weight="700">Compose</text><text x="282" y="225" font-size="16" fill="#A5BDD1" >Separate concerns.</text><rect x="496" y="114" width="200" height="133" rx="16" fill="#0E2133" stroke="#294359"/><circle cx="522" cy="145" r="6" fill="#A5DC6F"/><text x="514" y="189" font-size="26" fill="#EFF7FF" font-weight="700">Verify</text><text x="514" y="225" font-size="16" fill="#A5BDD1" >Check real usage.</text><rect x="728" y="114" width="200" height="133" rx="16" fill="#0E2133" stroke="#294359"/><circle cx="754" cy="145" r="6" fill="#F4CC76"/><text x="746" y="189" font-size="26" fill="#EFF7FF" font-weight="700">Document</text><text x="746" y="225" font-size="16" fill="#A5BDD1" >Explain the boundaries.</text></g></svg>
