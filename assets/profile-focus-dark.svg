<svg xmlns="http://www.w3.org/2000/svg" width="960" height="366" viewBox="0 0 960 366" role="img" aria-labelledby="title desc"><title id="title">Four areas of my work</title><desc id="desc">Backend systems, developer tooling, Discord applications, and AI workflows. These areas connect my public projects and development toolkit.</desc><rect x="1" y="1" width="958" height="364" rx="24" fill="#071320" stroke="#294359"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="38" font-size="14" fill="#A5BDD1" font-weight="700" letter-spacing="2">WHAT I WORK ON</text><text x="32" y="82" font-size="34" fill="#EFF7FF" font-weight="700" letter-spacing="-1">Backend at the center.</text><rect x="32" y="113" width="434" height="100" rx="16" fill="#0E2133" stroke="#294359"/><text x="52" y="151" font-size="25" fill="#EFF7FF" font-weight="700">Backend systems</text><text x="52" y="187" font-size="20" fill="#A5BDD1" >APIs, services, and data.</text><text x="440" y="147" font-size="15" fill="#38C9EF" text-anchor="end" font-weight="700">01</text><rect x="494" y="113" width="434" height="100" rx="16" fill="#0E2133" stroke="#294359"/><text x="514" y="151" font-size="25" fill="#EFF7FF" font-weight="700">Developer tooling</text><text x="514" y="187" font-size="20" fill="#A5BDD1" >Inspection, diagnosis, and reports.</text><text x="902" y="147" font-size="15" fill="#A5DC6F" text-anchor="end" font-weight="700">02</text><rect x="32" y="235" width="434" height="100" rx="16" fill="#0E2133" stroke="#294359"/><text x="52" y="273" font-size="25" fill="#EFF7FF" font-weight="700">Discord applications</text><text x="52" y="309" font-size="20" fill="#A5BDD1" >Community tools and visual cards.</text><text x="440" y="269" font-size="15" fill="#A6BFFF" text-anchor="end" font-weight="700">03</text><rect x="494" y="235" width="434" height="100" rx="16" fill="#0E2133" stroke="#294359"/><text x="514" y="273" font-size="25" fill="#EFF7FF" font-weight="700">AI workflows</text><text x="514" y="309" font-size="20" fill="#A5BDD1" >Dataset, training, and evaluation.</text><text x="902" y="269" font-size="15" fill="#F4CC76" text-anchor="end" font-weight="700">04</text></g></svg>
