<svg xmlns="http://www.w3.org/2000/svg" width="960" height="278" viewBox="0 0 960 278" role="img" aria-labelledby="title desc"><title id="title">Inspect, compose, verify, document</title><desc id="desc">Public projects show recurring attention to inspectable evidence, separated responsibilities, practical validation, and clear documentation.</desc><rect x="1" y="1" width="958" height="276" rx="24" fill="#F4F8FC" stroke="#CDDCE8"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="38" font-size="14" fill="#526D83" font-weight="700" letter-spacing="2">RECURRING THEMES IN MY PUBLIC WORK</text><text x="32" y="82" font-size="32" fill="#18334B" font-weight="700" letter-spacing="-0.5">Make the work understandable.</text><rect x="32" y="114" width="200" height="133" rx="16" fill="#FFFFFF" stroke="#CDDCE8"/><circle cx="58" cy="145" r="6" fill="#006F91"/><text x="50" y="189" font-size="26" fill="#18334B" font-weight="700">Inspect</text><text x="50" y="225" font-size="16" fill="#526D83" >Show the evidence.</text><rect x="264" y="114" width="200" height="133" rx="16" fill="#FFFFFF" stroke="#CDDCE8"/><circle cx="290" cy="145" r="6" fill="#3F62A8"/><text x="282" y="189" font-size="26" fill="#18334B" font-weight="700">Compose</text><text x="282" y="225" font-size="16" fill="#526D83" >Separate concerns.</text><rect x="496" y="114" width="200" height="133" rx="16" fill="#FFFFFF" stroke="#CDDCE8"/><circle cx="522" cy="145" r="6" fill="#426B20"/><text x="514" y="189" font-size="26" fill="#18334B" font-weight="700">Verify</text><text x="514" y="225" font-size="16" fill="#526D83" >Check real usage.</text><rect x="728" y="114" width="200" height="133" rx="16" fill="#FFFFFF" stroke="#CDDCE8"/><circle cx="754" cy="145" r="6" fill="#956A14"/><text x="746" y="189" font-size="26" fill="#18334B" font-weight="700">Document</text><text x="746" y="225" font-size="16" fill="#526D83" >Explain the boundaries.</text></g></svg>
